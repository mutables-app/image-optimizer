name: Publish npm packages

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish both npm packages after validation
        type: boolean
        default: false
        required: true
      reuse_build_run_id:
        description: Reuse the optimizer artifact from a successful workflow run instead of rebuilding
        type: string
        required: false

permissions:
  contents: read
  actions: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: emscripten-core/setup-emsdk@v15
        with:
          version: 6.0.10
          actions-cache-folder: emsdk-cache
        if: github.event_name != 'workflow_dispatch' || inputs.reuse_build_run_id == ''

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: beta
          targets: wasm32-unknown-emscripten
        if: github.event_name != 'workflow_dispatch' || inputs.reuse_build_run_id == ''

      - run: cargo install wasm-bindgen-cli --version 0.2.129 --locked
        if: github.event_name != 'workflow_dispatch' || inputs.reuse_build_run_id == ''

      - run: sudo apt-get update && sudo apt-get install -y cmake meson ninja-build python3 python3-pil
        if: github.event_name != 'workflow_dispatch' || inputs.reuse_build_run_id == ''

      - run: npm ci
        if: github.event_name != 'workflow_dispatch' || inputs.reuse_build_run_id == ''

      - name: Build WebAssembly packages
        run: EM_CONFIG="$EMSDK/.emscripten" bash scripts/build.sh
        env:
          CMAKE: cmake
        if: github.event_name != 'workflow_dispatch' || inputs.reuse_build_run_id == ''

      - run: npm test
        if: github.event_name != 'workflow_dispatch' || inputs.reuse_build_run_id == ''

      - run: npm run check:worker
        if: github.event_name != 'workflow_dispatch' || inputs.reuse_build_run_id == ''

      - uses: actions/upload-artifact@v4
        with:
          name: optimizer-wasm-dist
          path: packages/optimizer/dist/
          if-no-files-found: error
        if: github.event_name != 'workflow_dispatch' || inputs.reuse_build_run_id == ''

      - name: Download optimizer build artifact from a prior run
        uses: actions/download-artifact@v4
        with:
          name: optimizer-wasm-dist
          path: packages/optimizer/dist/
          github-token: ${{ github.token }}
          run-id: ${{ inputs.reuse_build_run_id }}
        if: github.event_name == 'workflow_dispatch' && inputs.publish && inputs.reuse_build_run_id != ''

      - name: Check whether the optimizer version is already published
        id: optimizer-version
        working-directory: packages/optimizer
        run: |
          version="$(node -p "require('./package.json').version")"
          if npm view "@mutables.app/image-optimizer@$version" version >/dev/null 2>&1; then
            echo 'published=true' >> "$GITHUB_OUTPUT"
          else
            echo 'published=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Check whether the Computer version is already published
        id: computer-version
        working-directory: packages/computer
        run: |
          version="$(node -p "require('./package.json').version")"
          if npm view "@mutables.app/image-computer@$version" version >/dev/null 2>&1; then
            echo 'published=true' >> "$GITHUB_OUTPUT"
          else
            echo 'published=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Stage optimizer package for approval
        working-directory: packages/optimizer
        run: npm stage publish --access public
        if: (github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && inputs.publish)) && steps.optimizer-version.outputs.published != 'true'

      - name: Stage Computer adapter for approval
        working-directory: packages/computer
        run: npm stage publish --access public
        if: (github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && inputs.publish)) && steps.computer-version.outputs.published != 'true'
